name: Kotlin Multiplatform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for each branch; rapid pushes must not
# leave a queue of obsolete builds consuming runners.
concurrency:
  group: lynox-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Run JVM tests
        run: gradle :lynox-engine:jvmTest
      - name: Compile Android
        run: gradle :lynox-engine:compileDebugKotlinAndroid
      - name: Compile desktop JVM
        run: gradle :lynox-engine:compileKotlinJvm
      - name: Validate Maven publications
        run: gradle :lynox-engine:publishAllPublicationsToBuildDirectoryRepository -PVERSION_NAME=0.1.0-validation

  ios:
    name: iOS frameworks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Assemble release XCFramework (device + simulators)
        run: gradle :lynox-engine:assembleLynoxEngineReleaseXCFramework
      - name: Upload release XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: LynoxEngine-iOS-Release-XCFramework
          path: lynox-engine/build/XCFrameworks/release/LynoxEngine.xcframework
          if-no-files-found: error
          retention-days: 14
