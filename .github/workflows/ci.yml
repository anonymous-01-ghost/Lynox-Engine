name: Kotlin Multiplatform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-android:
    name: JVM and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Run JVM tests
        run: gradle :lynox-engine:jvmTest
      - name: Compile Android
        run: gradle :lynox-engine:compileDebugKotlinAndroid
      - name: Compile desktop JVM
        run: gradle :lynox-engine:compileKotlinJvm
      - name: Validate Maven publications
        run: gradle :lynox-engine:publishAllPublicationsToBuildDirectoryRepository -PVERSION_NAME=0.1.0-validation

  ios:
    name: iOS frameworks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile iOS device framework
        run: gradle :lynox-engine:linkReleaseFrameworkIosArm64
      - name: Compile iOS simulator framework (Apple Silicon)
        run: gradle :lynox-engine:linkReleaseFrameworkIosSimulatorArm64
      - name: Compile iOS simulator framework (Intel)
        run: gradle :lynox-engine:linkReleaseFrameworkIosX64
